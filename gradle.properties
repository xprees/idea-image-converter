group = cz.xprees.imagetools

# Plugin version = <major>.<minor>.<patch>[-suffix]. Major and minor are set here (CI may override them with the
# PLUGIN_VERSION_MAJOR / PLUGIN_VERSION_MINOR environment variables; 0.1 is the fallback when neither is set).
# The patch comes from git tags: a build of a tagged commit uses the tag as its version (0.1.3, v0.1.3, 0.2.0-beta.1),
# any other build gets the next free patch for this major.minor. -PpluginVersion=x.y.z (or PLUGIN_VERSION) overrides all of it.
pluginVersionMajor = 0
pluginVersionMinor = 1

pluginRepositoryUrl = https://github.com/xprees/idea-image-converter

# Supported IDEs: all of 2026 (build lines 261, 262, 263) and every future release.
# platformVersion = oldest supported IDE. The plugin is compiled and tested against it and since-build is derived from it
#                   (2026.1.5 -> 261). Building against the oldest keeps us from using APIs the older IDEs lack.
# There is deliberately no until-build: newer IDEs are assumed to work until one is found not to. If that happens, cap the range
# with pluginUntilBuild (e.g. pluginUntilBuild = 263.*) and fix the break. -PpluginSinceBuild overrides the derived since-build.
platformVersion = 2026.1.5

# IDEs the Plugin Verifier checks (CI). The platform is shared by all IDEs, so IDEA covers every generation and WebStorm and Rider the
# oldest and newest. Add each new IDE release here to keep checking it. Rider 2026.3 isn't
# final yet (RC only): add it to the Rider list once it is released.
verifyIdeaVersions = 2026.1.5, 2026.2.3, 2026.3
verifyWebStormVersions = 2026.1.5, 2026.3
verifyRiderVersions = 2026.1.5, 2026.2.3

# libavif release that natives.yml builds and downloadAvifNatives fetches
libavifVersion = 1.4.2

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
