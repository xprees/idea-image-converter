group = cz.xprees.imagetools
version = 0.1.0

pluginRepositoryUrl = https://github.com/xprees/idea-image-converter

# Newest IDE the plugin is built, tested and verified against (IDEA, WebStorm and Rider of this version).
# The compatibility range is derived from it: 2026.2.3 -> build line 262 -> since-build 262, until-build 262.*
# Moving to a newer IDE generation means bumping this one line (and verifying it). Override the derived range with
# -PpluginSinceBuild=... / -PpluginUntilBuild=... if ever needed.
platformVersion = 2026.2.3

# libavif release that natives.yml builds and downloadAvifNatives fetches
libavifVersion = 1.4.2

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
